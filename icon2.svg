<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D96B37"/>
      <stop offset="1" stop-color="#A83B15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#FFE6CC" stop-opacity="0.32"/>
      <stop offset="0.65" stop-color="#FFE6CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9F2"/>
      <stop offset="1" stop-color="#F4DEC6"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.55" stop-color="#B8754C" stop-opacity="0"/>
      <stop offset="1" stop-color="#B8754C" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3EADF"/>
    </linearGradient>
    <clipPath id="bowlClip"><path d="M216 566 H808 C808 730 690 828 512 828 C334 828 216 730 216 566 Z"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#5A1C05" flood-opacity="0.32"/>
    </filter>
    <filter id="steamShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6B2407" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 湯気：ご飯から立ちのぼる2本の湯気が、上で合わさってハートになる -->
  <g transform="translate(0,-28) translate(512,152) scale(0.9) translate(-512,-152)" fill="none" stroke="#FFF4E6" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#steamShadow)">
    <path d="M482 424 C474 396 448 372 414 344 C368 306 344 276 344 234 C344 186 382 152 430 152 C468 152 498 174 512 210"/>
    <path d="M542 424 C550 396 576 372 610 344 C656 306 680 276 680 234 C680 186 642 152 594 152 C556 152 526 174 512 210"/>
  </g>

  <g transform="translate(0,-22) translate(512,660) scale(1.12) translate(-512,-660)" filter="url(#soft)">
    <!-- 高台 -->
    <path d="M428 806 H596 L588 862 Q586 874 574 874 H450 Q438 874 436 862 Z" fill="#EFD5BA"/>
    <!-- ご飯（山盛り） -->
    <path d="M258 570 C266 488 378 452 512 452 C646 452 758 488 766 570 Z" fill="url(#rice)"/>
    <g fill="#E3D3BF" opacity="0.55"><ellipse cx="402" cy="500" rx="17" ry="9" transform="rotate(-22 402 500)"/><ellipse cx="474" cy="482" rx="17" ry="9" transform="rotate(8 474 482)"/><ellipse cx="556" cy="484" rx="17" ry="9" transform="rotate(-10 556 484)"/><ellipse cx="628" cy="500" rx="17" ry="9" transform="rotate(24 628 500)"/><ellipse cx="346" cy="532" rx="17" ry="9" transform="rotate(-32 346 532)"/><ellipse cx="520" cy="516" rx="17" ry="9" transform="rotate(2 520 516)"/><ellipse cx="688" cy="530" rx="17" ry="9" transform="rotate(30 688 530)"/><ellipse cx="438" cy="532" rx="17" ry="9" transform="rotate(14 438 532)"/><ellipse cx="604" cy="532" rx="17" ry="9" transform="rotate(-14 604 532)"/></g>
    <!-- 器 -->
    <path d="M216 566 H808 C808 730 690 828 512 828 C334 828 216 730 216 566 Z" fill="url(#bowl)"/>
    <g clip-path="url(#bowlClip)">
      <rect x="200" y="560" width="624" height="300" fill="url(#shade)"/>
      <rect x="200" y="622" width="624" height="22" fill="#E59B70"/>
      <rect x="200" y="656" width="624" height="8" fill="#E59B70" opacity="0.65"/>
    </g>
    <!-- 縁 -->
    <rect x="204" y="550" width="616" height="34" rx="17" fill="#FFFCF8"/>
  </g>
</svg>
